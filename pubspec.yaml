name: ccm_app
description: "CCM"

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.8.0
  file_picker: ^12.1.3
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.3
  firebase_messaging: ^16.5.0
  firebase_storage: ^13.0.2
  image_picker: ^1.2.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

dependency_overrides:
  path_provider_android: 2.2.16

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/ccm_logo.png
  adaptive_icon_background: "#F5EEE5"
  adaptive_icon_foreground: assets/ccm_logo.png

flutter_native_splash:
  color: "#F5EEE5"
  image: assets/ccm_logo-2.png

  android: true
  ios: true

  android_12:
    color: "#F5EEE5"
    image: assets/ccm_logo-2.png